<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UniTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon sprite: one definition, referenced by both this shell and app.js -->
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24">
      <path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
    </symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </symbol>
    <symbol id="i-roadmap" viewBox="0 0 24 24">
      <polyline points="3 6 4.5 7.5 7 5"/><polyline points="3 12 4.5 13.5 7 11"/>
      <polyline points="3 18 4.5 19.5 7 17"/><line x1="11" y1="6" x2="21" y2="6"/>
      <line x1="11" y1="12" x2="21" y2="12"/><line x1="11" y1="18" x2="21" y2="18"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24">
      <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
      <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
      <line x1="17" y1="16" x2="23" y2="16"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24">
      <line x1="9" y1="5" x2="9.01" y2="5"/><line x1="15" y1="5" x2="15.01" y2="5"/>
      <line x1="9" y1="12" x2="9.01" y2="12"/><line x1="15" y1="12" x2="15.01" y2="12"/>
      <line x1="9" y1="19" x2="9.01" y2="19"/><line x1="15" y1="19" x2="15.01" y2="19"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/><path d="M14 11v6"/>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
    </symbol>
  </svg>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg class="icon logo-icon"><use href="#i-logo"/></svg>
        <span class="logo-text">UniTracker</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-view="dashboard" href="#dashboard">
          <svg class="icon"><use href="#i-dashboard"/></svg><span>Dashboard</span>
        </a>
        <a class="nav-item" data-view="schedule" href="#schedule">
          <svg class="icon"><use href="#i-calendar"/></svg><span>Schedule</span>
        </a>
        <a class="nav-item" data-view="courses" href="#courses">
          <svg class="icon"><use href="#i-book"/></svg><span>Courses</span>
        </a>
        <a class="nav-item" data-view="assignments" href="#assignments">
          <svg class="icon"><use href="#i-clipboard"/></svg><span>Assignments</span>
        </a>
        <a class="nav-item" data-view="grades" href="#grades">
          <svg class="icon"><use href="#i-chart"/></svg><span>Grades</span>
        </a>
        <a class="nav-item" data-view="notes" href="#notes">
          <svg class="icon"><use href="#i-note"/></svg><span>Notes</span>
        </a>
        <a class="nav-item" data-view="roadmap" href="#roadmap">
          <svg class="icon"><use href="#i-roadmap"/></svg><span>Roadmap</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-portal">
          <button class="nav-item nav-btn" onclick="openPortal()">
            <svg class="icon"><use href="#i-external"/></svg><span>Uni Portal</span>
          </button>
          <button class="icon-btn portal-edit" onclick="openPortalSettings()"
                  title="Edit portal URL" aria-label="Edit portal URL">
            <svg class="icon icon-sm"><use href="#i-pencil"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main id="content" class="main-content">
      <div class="loading">Connecting to database…</div>
    </main>
  </div>

  <dialog id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" onclick="closeModal()" aria-label="Close">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <!-- Its own <dialog>, not a reuse of #modal: deleting from inside the schedule
       editor has to stack a confirmation ON TOP of that open form rather than
       tearing it down to ask. Dialogs stack in the top layer, newest on top. -->
  <dialog id="confirm">
    <div class="modal-box confirm-box">
      <div class="modal-header">
        <h2 id="confirm-title">Are you sure?</h2>
      </div>
      <div class="confirm-body" id="confirm-text"></div>
      <div class="confirm-actions">
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="confirm-cancel" onclick="confirmNo()">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok" onclick="confirmYes()">Delete</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
